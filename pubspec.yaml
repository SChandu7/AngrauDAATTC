name: angrauasr
description: "ANGRAU DAATTC crop production guides for farmers."
publish_to: 'none'

version: 1.0.0+29

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_typeahead: ^5.2.0
  flutter_pdfview: ^1.3.2
  path_provider: ^2.1.3
  dio: ^5.5.0
  url_launcher: ^6.2.5
  share_plus: ^10.0.2
  http: ^1.2.0
  shared_preferences: ^2.2.2
  package_info_plus: ^8.0.0
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  rename: ^3.1.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/splash/splash.jpg
    




flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/angrauicon.jpg"
  min_sdk_android: 21
